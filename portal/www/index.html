<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local LLM Portal</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1b1f24; --muted:#5b6470; --line:#dde1e6; --accent:#2f6fde; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171b; --card:#1d2126; --fg:#e6e9ed; --muted:#9aa3ad; --line:#2c3238; --accent:#6ea0ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:960px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px; }
  a.card { display:block; background:var(--card); border:1px solid var(--line); border-radius:10px;
           padding:16px; color:inherit; text-decoration:none; }
  a.card:hover, a.card:focus-visible { border-color:var(--accent); outline:none; }
  .name { font-weight:600; }
  .url { color:var(--accent); font:13px ui-monospace, monospace; word-break:break-all; }
  .desc { color:var(--muted); font-size:13px; margin-top:6px; }
  h2 { font-size:15px; margin:28px 0 10px; color:var(--muted); font-weight:600; }
  code { font:13px ui-monospace, monospace; }
</style>
</head>
<body>
<main>
  <h1>Local LLM Portal</h1>
  <p class="sub">Entry points for this box. Links use the host you opened this page on (LAN or Tailscale).</p>
  <div class="grid" id="links"></div>
  <h2>API endpoints (LiteLLM key required)</h2>
  <div class="grid" id="apis"></div>
</main>
<script>
  const h = location.hostname, u = (port, path = "") => `${location.protocol}//${h}:${port}${path}`;
  const card = ([name, url, desc]) =>
    `<a class="card" href="${url}" target="_blank" rel="noopener"><div class="name">${name}</div>` +
    `<div class="url">${url}</div><div class="desc">${desc}</div></a>`;
  document.getElementById("links").innerHTML = [
    ["Open WebUI", u(3000), "Chat with local models. Own accounts; first sign-up is admin."],
    ["LiteLLM Admin", u(4000, "/ui"), "Keys, spend, models. Log in: admin / master key."],
    ["llama-swap", u(8001, "/ui"), "Loaded models, logs, load/unload. Portal login."],
    ["DGX Dashboard", u(8002), "GPU, memory, system telemetry. Portal login."],
  ].map(card).join("");
  document.getElementById("apis").innerHTML = [
    ["OpenAI API", u(4000, "/v1"), "base_url for OpenAI SDKs; Anthropic format at /v1/messages."],
    ["MCP (local-llm)", u(4000, "/mcp/"), "Streamable HTTP; Authorization: Bearer &lt;key&gt;. Read-only tools."],
    ["API docs", u(4000, "/"), "LiteLLM Swagger UI."],
  ].map(card).join("");
</script>
</body>
</html>
