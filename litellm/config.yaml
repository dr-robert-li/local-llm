model_list:
  - model_name: gemma-4-26b-a4b
    litellm_params:
      model: openai/gemma-4-26b-a4b
      api_base: http://127.0.0.1:8080/v1
      api_key: none

  # same backend, thinking on (for clients that can't send chat_template_kwargs)
  - model_name: gemma-4-26b-a4b-think
    litellm_params:
      model: openai/gemma-4-26b-a4b
      api_base: http://127.0.0.1:8080/v1
      api_key: none
      extra_body:
        chat_template_kwargs:
          enable_thinking: true

  - model_name: gemma-4-26b-a4b-q8
    litellm_params:
      model: openai/gemma-4-26b-a4b-q8
      api_base: http://127.0.0.1:8080/v1
      api_key: none

  - model_name: gemma-4-26b-a4b-vllm
    litellm_params:
      model: openai/gemma-4-26b-a4b-vllm
      api_base: http://127.0.0.1:8080/v1
      api_key: none

  - model_name: qwen3.8-27b
    litellm_params:
      model: openai/qwen3.8-27b
      api_base: http://127.0.0.1:8080/v1
      api_key: none

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

# exposed as http://<host>:4000/mcp (LiteLLM key required). Mutating tools stay local-only (stdio in Claude Code).
mcp_servers:
  local_llm:
    url: http://127.0.0.1:8090/mcp
    transport: http
    allowed_tools: [status, list_models, logs, ask_local]
